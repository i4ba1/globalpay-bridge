name: globalpay-bridge

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "GlobalPay_Local_2026!"
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - globalpay

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalpay

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - globalpay

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "Admin123!"
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak/globalpay-realm.json:/opt/keycloak/data/import/globalpay-realm.json:ro
    networks:
      - globalpay

  provider-simulator:
    build:
      context: .
      dockerfile: src/GlobalPay.ProviderSimulator/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5090:8080"
    networks:
      - globalpay

  api:
    build:
      context: .
      dockerfile: src/GlobalPay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GlobalPay: "Server=sqlserver,1433;Database=GlobalPayBridge;User Id=sa;Password=GlobalPay_Local_2026!;TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__Blobs: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      # Links handed to clients must use the host-visible address, not the Compose service name.
      Blobs__PublicEndpoint: "http://localhost:10000/devstoreaccount1"
      Payments__Provider__BaseAddress: "http://provider-simulator:8080"
      Authentication__Authority: "http://keycloak:8080/realms/globalpay"
      # Keycloak derives the issuer from the request host, so a token obtained from the host carries
      # localhost:8080. Metadata and signing keys are fetched from the in-network authority above.
      Authentication__AdditionalValidIssuers__0: "http://localhost:8080/realms/globalpay"
      Authentication__Audience: "globalpay-api"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - globalpay

  functions:
    build:
      context: .
      dockerfile: src/GlobalPay.Functions/Dockerfile
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      Blobs: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      Payments__Provider__BaseAddress: "http://provider-simulator:8080"
      ConnectionStrings__GlobalPay: "Server=sqlserver,1433;Database=GlobalPayBridge;User Id=sa;Password=GlobalPay_Local_2026!;TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__Blobs: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    ports:
      - "7080:80"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      azurite:
        condition: service_started
    networks:
      - globalpay

volumes:
  mssql-data:
  azurite-data:

networks:
  globalpay:
    driver: bridge
