name: security-scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Scan dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GlobalPayBridge.slnx

      - name: List vulnerable packages
        run: |
          dotnet list GlobalPayBridge.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Vulnerable packages detected"
            exit 1
          fi

      - name: List deprecated packages
        run: dotnet list GlobalPayBridge.slnx package --deprecated || true
